[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"
package_manager = "pnpm"

[workspace]
members = ["programs/pwrc-lock", "programs/token"]
exclude = ["programs/pwrc-fees"]

[features]
resolution = true
skip-lint = false

# Local development identity only.
# Devnet/Mainnet program IDs MUST remain unset in configuration until a
# separately built, deployed, executable, and verified program is published.
[programs.localnet]
pwrc_lock = "7JAV3PsxkHh5oKAFDMKqVpKaV2P2P5Vj3Qv15hH8wPwr"
pwrc_token = "HRrDxwZzuFreRmkCLY9oFXNGAy2gjd3diHyyTadxd8s6"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm test:anchor-program"
program-check = "pnpm pwrc:programs:check"
bridge-check = "pnpm pwrc:wpwrc:spec-check"
