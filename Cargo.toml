[workspace]
members = [
  "programs/pwrc-lock",
]
exclude = [
  "programs/pwrc-fees",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", features = ["token_2022", "token_2022_extensions"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev]
overflow-checks = true
debug = true
