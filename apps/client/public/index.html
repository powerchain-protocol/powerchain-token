<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PowerChain Token</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f6f7f6}
    body{margin:0}.wrap{max-width:920px;margin:0 auto;padding:40px 20px}
    .card{background:#fff;border:1px solid #e4e7e4;border-radius:18px;padding:24px;margin:16px 0}
    button{background:#174d36;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
    input,select{padding:11px;border:1px solid #d6dad6;border-radius:10px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    code{word-break:break-all}.muted{color:#68716a}.fee{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:10px 0}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>PowerChain Token</h1>
  <p class="muted">PWRC Token-2022 • version 1.0.0</p>
  <div class="card">
    <div><strong>Canonical mint</strong></div>
    <code>PWRCRXXZxbg6FdQZfK3PMD7KP8xfxs9acvifJiG46wc</code>
  </div>
  <div class="card">
    <h2>Fee quote</h2>
    <div class="grid">
      <input id="amount" value="1000" inputmode="decimal" aria-label="PWRC amount"/>
      <select id="operation" aria-label="Operation">
        <option value="bridge-solana-to-sui">Solana → Sui bridge</option>
        <option value="bridge-sui-to-solana">Sui → Solana bridge</option>
        <option value="wallet-transfer">Wallet transfer</option>
      </select>
    </div>
    <p><button id="quote">Calculate fees</button></p>
    <div id="result"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
