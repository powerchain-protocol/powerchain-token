[package]
name = "pwrc-fees"
version = "1.0.0"
description = "PowerChain PWRC protocol fee program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pwrc_fees"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", features = ["token_2022", "token_2022_extensions"] }
